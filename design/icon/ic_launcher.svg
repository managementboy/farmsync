<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432">
  <title>Farm Sync app icon: a sprout on a hill, framed by two sync arrows</title>
  <!-- Background layer: dawn sky and a rounded hill (full bleed, unmasked) -->
  <rect width="108" height="108" fill="#CDEFF7"/>
  <path d="M0 80 C 22 66, 44 70, 60 78 C 76 86, 94 76, 108 70 L108 108 L0 108 Z" fill="#9BD67F"/>
  <path d="M0 92 C 28 84, 58 90, 108 84 L108 108 L0 108 Z" fill="#6FBE5C"/>

  <!-- Foreground layer (inside the 72dp safe zone: 18..90) -->
  <!-- Sync arrows in harvest gold -->
  <path d="M30 46 A 25 25 0 0 1 74 36" fill="none" stroke="#E8A92C" stroke-width="6" stroke-linecap="round"/>
  <path d="M68 28 L80 36 L68 43 Z" fill="#E8A92C"/>
  <path d="M78 62 A 25 25 0 0 1 34 72" fill="none" stroke="#E8A92C" stroke-width="6" stroke-linecap="round"/>
  <path d="M40 80 L28 72 L40 65 Z" fill="#E8A92C"/>

  <!-- Soil mound -->
  <ellipse cx="54" cy="70" rx="15" ry="6" fill="#8A5A33"/>
  <!-- Stem -->
  <path d="M54 68 L54 52" stroke="#2F7D32" stroke-width="5" stroke-linecap="round"/>
  <!-- Leaves -->
  <path d="M54 56 C 43 57, 36 50, 37 40 C 47 40, 54 46, 54 56 Z" fill="#3E9B4A"/>
  <path d="M54 52 C 64 52, 72 45, 71 34 C 60 34, 54 41, 54 52 Z" fill="#69C060"/>
</svg>
